# Vhost nginx — dnsmasqwebui.mawena.cloud
#
# Sert la page de documentation (index.html) + le dépôt apt (repo/).
# Le webroot est le dossier où le projet est CLONÉ depuis GitHub (git pull) :
#   git clone <repo> /var/www/dnsmasq-webui
#
# Installation :
#   sudo cp deploy/nginx-dnsmasqwebui.conf /etc/nginx/sites-available/dnsmasqwebui.mawena.cloud
#   sudo ln -s /etc/nginx/sites-available/dnsmasqwebui.mawena.cloud /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dnsmasqwebui.mawena.cloud     # ajoute le TLS (listen 443)

server {
    listen 80;
    listen [::]:80;
    server_name dnsmasqwebui.mawena.cloud;

    root /var/www/dnsmasq-webui;

    # Page de documentation à la racine.
    location = / {
        try_files /index.html =404;
    }

    # Fichiers publics explicitement autorisés.
    location = /favicon.svg { }
    location = /setup.sh { default_type text/x-shellscript; }

    # Dépôt apt : index (Packages/Release/InRelease), clé .asc et .deb sous ubuntu/.
    location /repo/ {
        autoindex on;
    }

    # Tout le reste (sources PHP, packaging/, docs/, scripts, .git) reste masqué :
    # le code arrive par git pull mais n'est jamais servi publiquement.
    location / {
        return 404;
    }

    # certbot ajoutera ici le bloc TLS (listen 443 ssl + chemins des certificats).
}
